<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d"><link rel="manifest" href="manifest.json"><title>NEO CAM</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="camera-stage">
    <video id="preview" autoplay playsinline muted></video>
    <div class="shade"></div>
    <div class="camera-note" id="cameraNote">VISTA COMPLETA · 1.0×</div>
    <div class="record-timer" id="recordTimer">00:00</div>
  </section>

  <header><div class="brand"><span>✦</span> NEO CAM</div><button id="switchCam" class="icon-btn">↻</button></header>
  <section class="hud">
    <div class="status"><span class="dot"></span><span id="statusText">CÁMARA LISTA</span></div>
    <div class="effect-chip">🎙️ <span id="effectName">NORMAL</span></div>
  </section>

  <section class="controls-panel">
    <div class="effects">
      <button class="effect active" data-effect="normal">NORMAL</button>
      <button class="effect" data-effect="robot">🤖 ROBOT</button>
      <button class="effect" data-effect="demon">👹 DEMON</button>
      <button class="effect" data-effect="radio">📻 RADIO</button>
      <button class="effect" data-effect="glitch">⚡ GLITCH</button>
    </div>

    <div class="control-row">
      <div class="control-box"><label>VOZ <output id="intensityValue">60%</output></label><input id="intensity" type="range" min="0" max="100" value="60"></div>
      <div class="control-box zoom-box"><label>ZOOM <output id="zoomValue">1.0×</output></label><input id="zoom" type="range" min="1" max="4" step="0.1" value="1"></div>
    </div>

    <div class="mic-meter"><span>MIC</span><div><i id="micLevel"></i></div><b id="audioState">AUDIO OK</b></div>

    <footer>
      <button id="mute" class="small-btn">🎙️</button>
      <button id="record" class="record"><span></span></button>
      <button id="download" class="small-btn" disabled>↓</button>
    </footer>
  </section>
</main>
<script src="app.js"></script>
</body></html>
